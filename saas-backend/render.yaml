services:
  - type: web
    name: ruvali-backend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false  # Required: set this in Render Dashboard or link a Render Postgres service
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false  # Set in Render Dashboard: comma-separated frontend URLs, e.g. https://your-app.vercel.app
      - key: ADMIN_JWT_SECRET
        generateValue: true  # Auto-generates a secure random secret
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CUSTOMER_JWT_SECRET
        generateValue: true
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
      - key: WHATSAPP_ENABLED
        value: 'true'  
